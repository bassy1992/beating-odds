[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = ["pip3 install -r backend/requirements.txt"]

[start]
cmd = "cd backend && python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
